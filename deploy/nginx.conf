# إعداد Nginx لنظام الموارد البشرية
# - الموظفون والإدارة عبر HTTPS (شرط لعمل تحديد الموقع في متصفحات الجوال)
# - أجهزة ZKTeco بوضع الدفع (ADMS) عبر HTTP على المنفذ 80 لأن أغلبها لا يدعم HTTPS

upstream hr_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name hr.example.com;   # ← ضع نطاقك

    # مسار أجهزة البصمة: يبقى على HTTP ولا يُحوَّل إلى HTTPS
    location /iclock/ {
        # اسمح بعناوين أجهزتك فقط (أضف سطر allow لكل جهاز)
        # allow 192.168.1.201;
        # allow 192.168.1.202;
        # deny all;

        proxy_pass         http://hr_app;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # تجديد شهادات Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # صيغة متوافقة مع nginx 1.24 (Ubuntu 24.04) وما بعدها
    listen 443 ssl http2;
    server_name hr.example.com;   # ← ضع نطاقك

    ssl_certificate     /etc/letsencrypt/live/hr.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hr.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    client_max_body_size 8m;   # مرفقات الإجازات

    location / {
        proxy_pass         http://hr_app;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
