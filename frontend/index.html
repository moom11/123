<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>نظام الموارد البشرية - الحضور والإجازات</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/app/styles.css" />
<link rel="manifest" href="/app/manifest.json" />
<meta name="theme-color" content="#0f766e" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="الموارد البشرية" />
<link rel="apple-touch-icon" href="/app/assets/icon-192.png" />
<link rel="icon" href="/app/assets/icon-192.png" />
</head>
<body>
  <!-- شاشة تسجيل الدخول -->
  <div id="login" class="login-wrap">
    <form class="login-card" id="loginForm">
      <h1>نظام الموارد البشرية</h1>
      <p class="sub">الحضور والانصراف والإجازات - متكامل مع أجهزة بصمة ZKTeco</p>
      <div class="field">
        <label for="username">اسم المستخدم</label>
        <input id="username" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="password">كلمة المرور</label>
        <input id="password" type="password" autocomplete="current-password" required />
      </div>
      <button class="btn" style="width:100%;justify-content:center" type="submit">دخول</button>
      <div class="demo-note" id="loginHint">
        الحساب الافتراضي بعد التثبيت: <code>admin / admin123</code><br />
        غيّر كلمة المرور فوراً من صفحة «حسابي».
      </div>
    </form>
  </div>

  <!-- التطبيق -->
  <div id="app" class="layout hidden">
    <aside class="sidebar">
      <div class="brand">
        <h2>الموارد البشرية</h2>
        <span>الحضور والانصراف والإجازات</span>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-footer">
        <div id="sideUser"></div>
        <a id="logoutBtn" style="color:#f3b1ac;cursor:pointer">تسجيل الخروج</a>
      </div>
    </aside>
    <main class="main">
      <div class="topbar">
        <h1 id="pageTitle">لوحة المؤشرات</h1>
        <div style="display:flex;align-items:center;gap:12px">
          <span class="who" id="topWho"></span>
          <button class="btn sm ghost hidden" id="installBtn" onclick="installApp()">تثبيت التطبيق</button>
          <button class="bell" id="bellBtn" title="الإشعارات">🔔<span class="badge hidden" id="bellCount">0</span></button>
          <button class="btn sm" id="selfPunchBtn">تسجيل بصمة الآن</button>
        </div>
      </div>
      <div class="content" id="view"></div>
    </main>
  </div>

  <div id="modalRoot"></div>
  <div class="toast-wrap" id="toasts"></div>
  <script src="/app/app.js"></script>
</body>
</html>
