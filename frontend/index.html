<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>نظام الموارد البشرية - الحضور والإجازات</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/app/styles.css" />
<script>
  // اللغة والاتجاه قبل الرسم لتفادي وميض الاتجاه
  (function () {
    var lang = localStorage.getItem('hr_lang') || 'ar';
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'en' ? 'ltr' : 'rtl';
  })();
</script>
<link rel="manifest" href="/app/manifest.json" />
<meta name="theme-color" content="#0f766e" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="format-detection" content="telephone=no" />
<meta name="apple-mobile-web-app-title" content="الموارد البشرية" />
<link rel="apple-touch-icon" href="/app/assets/icon-192.png" />
<link rel="icon" href="/app/assets/icon-192.png" />
</head>
<body>
  <!-- شاشة تسجيل الدخول -->
  <div id="login" class="login-wrap">
    <form class="login-card" id="loginForm">
      <img id="loginLogo" class="brand-logo hidden" alt="شعار المنشأة" />
      <h1 id="loginTitle">نظام الموارد البشرية</h1>
      <p class="sub">الحضور والانصراف والإجازات - متكامل مع أجهزة بصمة ZKTeco</p>
      <p class="quote" id="loginQuote"></p>
      <div class="field">
        <label for="username">اسم المستخدم أو رقم الجوال</label>
        <input id="username" autocomplete="username" inputmode="tel" enterkeyhint="next"
               placeholder="مثال: 0500000000" required />
      </div>
      <div class="field">
        <label for="password">كلمة المرور</label>
        <input id="password" type="password" autocomplete="current-password" required />
      </div>
      <button class="btn" style="width:100%;justify-content:center" type="submit">دخول</button>
      <button type="button" class="btn ghost" id="loginLang"
        style="width:100%;justify-content:center;margin-top:10px">English / العربية</button>
      <div class="demo-note hidden" id="loginHint">
        لم تُغيَّر كلمة مرور مدير النظام بعد. ادخل بالحساب الافتراضي
        <code>admin</code> ثم غيّر كلمة المرور فوراً من صفحة «حسابي»
        — وسيختفي هذا التنبيه.
      </div>
    </form>
  </div>

  <!-- التطبيق -->
  <div id="app" class="layout hidden">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" id="brandMark">HR</div>
        <div class="brand-text">
          <img id="sideLogo" class="side-logo hidden" alt="شعار المنشأة" />
          <h2 id="sideTitle">الموارد البشرية</h2>
          <span>الحضور والانصراف والإجازات</span>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-footer">
        <div class="who-name" id="sideUser"></div>
        <a id="logoutBtn" title="تسجيل الخروج">⏻</a>
      </div>
    </aside>
    <main class="main">
      <div class="topbar">
        <div style="display:flex;align-items:center;gap:10px;min-width:0">
          <button class="icon-btn" id="menuBtn" title="القائمة" aria-label="القائمة">☰</button>
          <button class="icon-btn" id="collapseBtn" title="تصغير القائمة" aria-label="تصغير القائمة">⇤</button>
          <h1 id="pageTitle">لوحة المؤشرات</h1>
        </div>
        <div class="topbar-actions">
          <span class="who" id="topWho"></span>
          <button class="btn sm ghost hidden" id="installBtn" onclick="installApp()">تثبيت التطبيق</button>
          <button class="icon-btn" id="langBtn" title="English / العربية">🌐</button>
          <button class="bell" id="bellBtn" title="الإشعارات">🔔<span class="badge hidden" id="bellCount">0</span></button>
          <button class="btn sm" id="selfPunchBtn">🕒 تسجيل بصمة</button>
        </div>
      </div>
      <div class="content" id="view"></div>
      <nav class="tabbar" id="tabbar"></nav>
    </main>
  </div>

  <div id="modalRoot"></div>
  <div class="toast-wrap" id="toasts"></div>
  <script src="/app/i18n.js"></script>
  <script src="/app/app.js"></script>
</body>
</html>
